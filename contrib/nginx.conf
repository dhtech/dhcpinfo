# An example: dhcpinfo behind nginx, for people who log in. Lease data
# says who was where - do not serve it to everybody.
server {
    listen 443 ssl;
    server_name dhcpinfo.example.net;
    ssl_certificate     /etc/ssl/dhcpinfo.crt;
    ssl_certificate_key /etc/ssl/private/dhcpinfo.key;

    # whatever your site uses: basic auth, PAM/LDAP, an SSO proxy, ...
    auth_basic           "dhcpinfo";
    auth_basic_user_file /etc/nginx/dhcpinfo.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
